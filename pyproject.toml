[project]
name = "dataryx"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Dataryx Team" }
]
dependencies = [
    "flet>=0.86.0",
    "polars>=1.8.2",
    "pyarrow>=18.0.0",
    "pandas>=2.2.0",
    "sqlalchemy>=2.0.27",
    "ibm-db>=3.2.3",
    "ibm-db-sa>=0.4.0",
    "psycopg2-binary>=2.9.9",
    "pymysql>=1.1.1",
    "oracledb>=2.4.1",
    "pydantic>=2.9.2",
    "httpx>=0.28.1",
    "apscheduler>=3.10.4",
    "python-dotenv>=1.0.0",
    "cryptography>=45.0.5",
    "pl-fuzzy-frame-match>=0.6.0",
    "polars-expr-transformer>=0.5.4",
    "polars-grouper>=0.4.0",
    "polars-ds>=0.11.2",
    "fastexcel>=0.20.2",
    "xlsxwriter>=3.2.9",
    "connectorx>=0.4.5",
    "polars-simed>=0.4.0",
    "deltalake>=1.6.0",
    "pyiceberg>=0.11.1",
    "boto3>=1.43.16",
    "s3fs>=0.4.2",
    "pyyaml>=6.0.3",
    "methodtools>=0.4.7",
    "faker>=40.19.1",
    "openpyxl>=3.1.5",
    "polars-distance>=0.4.3",
    "loky>=3.5.6",
    "pytz>=2026.2",
    "websockets>=12.0",
    "autopep8>=2.3.2",
]

[dependency-groups]
# Only what "flet build windows" itself needs (flet-cli ships the PyInstaller
# hook-dirs flet's build tooling relies on). Installed alone in CI so
# flet-desktop/flet-web (dev-only preview runtimes, ~90MB combined) and the
# test tools never end up in the packaged Windows build's venv.
build = [
    "flet-cli>=0.86.0",
    "pyinstaller>=6.11.0"
]
dev = [
    "flet-desktop>=0.86.0",
    "flet-web>=0.86.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.0",
]

[tool.flet]
org = "com.dataryx"
product = "Dataryx"
company = "Dataryx"
copyright = "Copyright (C) 2026 Dataryx"

[tool.flet.app]
path = "src"

[tool.pytest.ini_options]
pythonpath = [
    "src",
    "src/core"
]
